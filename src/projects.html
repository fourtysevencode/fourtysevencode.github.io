<!DOCTYPE html>
<!-- Template: scripts/build.mjs fills in the {{...}} placeholders and writes dist/project.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects · Ronak Pal</title>
    <meta name="description" content="Open-source projects by Ronak Pal: pinned projects first, then newest first. Each project has its own page with its README.">
    <meta name="author" content="Ronak Pal">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1e1e1e">

    <link rel="canonical" href="https://ronakbuilds.tech/projects.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Projects · Ronak Pal">
    <meta property="og:description" content="Open-source projects by Ronak Pal: pinned first, then newest first.">
    <meta property="og:url" content="https://ronakbuilds.tech/projects.html">
    <meta property="og:site_name" content="Ronak Pal">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Projects · Ronak Pal">
    <meta name="twitter:description" content="Open-source projects by Ronak Pal: pinned first, then newest first.">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Projects · Ronak Pal",
        "url": "https://ronakbuilds.tech/projects.html",
        "author": {
            "@type": "Person",
            "name": "Ronak Pal",
            "url": "https://ronakbuilds.tech/",
            "sameAs": [
                "https://github.com/fourtysevencode",
                "https://www.linkedin.com/in/ronakpal/"
            ]
        }
    }
    </script>
    {{structured_data}}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/projects.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to Projects</a>

    <div class="page">
        <header>
            <a class="back" href="/"><span aria-hidden="true">&lt;--</span>Home</a>
            <h1>Projects</h1>
            <p class="intro">
                Pinned projects first, then the rest newest first. Hit View More on any card to read its README,
                or browse everything on <a href="https://github.com/fourtysevencode" target="_blank" rel="noopener noreferrer me">GitHub</a>.
            </p>
        </header>

        <main id="main">
            <p class="status">{{count}}</p>
            <ul class="grid" aria-label="Projects">{{projects}}
            </ul>
        </main>

        <footer class="site-footer">
            <p>Updated {{updated}} from <a href="https://github.com/fourtysevencode?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
        </footer>
    </div>
</body>
</html>
